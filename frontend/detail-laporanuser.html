<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Laporan - KomuReport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER NAVIGASI ===== -->
  <header class="header">
    <div class="header-isi">
      <a href="dashboarduser.html" class="brand-nama">Komu<span>Report</span></a>
      <nav class="nav">
        <a href="dashboarduser.html" class="aktif">Dashboard</a>
        <a href="buat-laporan.html">Buat Laporan</a>
        <a href="profil.html">Profil</a>
        <a href="login.html" id="tombol-logout">Logout</a>  <!-- UBAH -->
      </nav>
    </div>
  </header>

  <main class="container">
    <a href="dashboarduser.html" class="link-kembali">← Kembali ke Dashboard</a>

    <!-- Isi diisi otomatis oleh js/ui/detail-user.js berdasarkan ?id= di alamat -->
    <div class="detail">

      <!-- ===== KOLOM KIRI: judul + foto ===== -->
      <section class="detail-utama">
        <h1 id="judul-laporan">Memuat...</h1>                 <!-- UBAH -->
        <p class="detail-meta" id="meta-laporan"></p>         <!-- UBAH -->
        <div class="detail-foto" id="foto-laporan"></div>     <!-- UBAH -->
      </section>

      <!-- ===== KOLOM KANAN: informasi + komentar ===== -->
      <aside class="detail-info">

        <div class="info-blok">
          <p class="info-label">Status</p>
          <span class="badge" id="status-laporan"></span>       <!-- UBAH -->
        </div>

        <div class="info-blok">
          <p class="info-label">Kategori</p>
          <p id="kategori-laporan"></p>                         <!-- UBAH -->
        </div>

        <div class="info-blok">
          <p class="info-label">Blok / Area</p>
          <p id="area-laporan"></p>                             <!-- UBAH -->
        </div>

        <div class="info-blok">
          <p class="info-label">Deskripsi</p>
          <p id="deskripsi-laporan"></p>                        <!-- UBAH -->
        </div>

        <div class="info-blok">
          <p class="info-label">Komentar</p>

          <!-- UBAH: wadah komentar real-time dari subkoleksi laporan/{id}/komentar -->
          <div id="daftar-komentar"></div>

          <!-- Form tulis komentar -->
          <form id="form-komentar" class="form-komentar">
            <input type="text" id="isi-komentar" name="isi" placeholder="Tulis komentar..." required>
            <button type="submit" class="tombol">Kirim Komentar</button>
          </form>
        </div>

      </aside>
    </div>
  </main>

  <script type="module" src="js/ui/detail-user.js"></script>  <!-- BARU -->
</body>
</html>
