<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KomuReport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="halaman-auth">

  <!-- ===== PANEL KIRI: sambutan ===== -->
  <section class="auth-sambutan auth-sambutan--biru">
    <div class="brand">
      <p class="brand-nama">Komu<span>Report</span></p>
      <p class="brand-tagline">Laporkan · Pantau · Selesaikan</p>
    </div>

    <div class="auth-judul">
      <h1>Selamat datang kembali.</h1>
      <p>Silahkan login untuk mengakses laporan warga.</p>
    </div>

    <p class="auth-footer">Komunitas Warga · Perumahan Martinez</p>
  </section>

  <!-- ===== PANEL KANAN: form login ===== -->
  <section class="auth-form-area">
    <form class="auth-form" id="form-login">
      <h2>Login</h2>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="tombol tombol-penuh">Login</button>

      <p class="auth-pindah">Belum punya akun? <a href="register.html">Register</a></p>
    </form>
  </section>

</body>
</html>
