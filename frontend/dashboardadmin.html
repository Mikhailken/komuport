<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - KomuReport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER NAVIGASI ADMIN ===== -->
  <header class="header">
    <div class="header-isi">
      <a href="dashboardadmin.html" class="brand-nama">Komu<span>Report</span></a>
      <nav class="nav">
        <a href="dashboardadmin.html" class="aktif">Dashboard</a>
        <a href="verifikasi-akun.html">Verifikasi Akun</a>
        <a href="login.html" id="tombol-logout">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <div class="judul-halaman">
      <div>
        <h1>Dashboard Admin</h1>
        <p class="subjudul">Kelola dan pantau laporan dari warga</p>
      </div>
    </div>

    <!-- ===== RINGKASAN: dihitung otomatis dari Firestore ===== -->
    <section class="statistik">
      <div class="statistik-kotak">
        <p class="statistik-angka" id="stat-total">0</p>
        <p class="statistik-label">Total</p>
      </div>
      <div class="statistik-kotak">
        <p class="statistik-angka" id="stat-belum">0</p>
        <p class="statistik-label">Belum Selesai</p>
      </div>
      <div class="statistik-kotak">
        <p class="statistik-angka" id="stat-proses">0</p>
        <p class="statistik-label">Diproses</p>
      </div>
      <div class="statistik-kotak">
        <p class="statistik-angka" id="stat-selesai">0</p>
        <p class="statistik-label">Selesai</p>
      </div>
    </section>

    <!-- ===== KOTAK PENCARIAN ===== -->
    <div class="kotak-cari">
      <span class="ikon-cari" aria-hidden="true">⌕</span>
      <input type="search" id="cari" placeholder="Cari judul, kategori, area, pelapor, atau status..." aria-label="Cari laporan">
    </div>

    <!-- ===== DAFTAR LAPORAN: real-time dari Firestore ===== -->
    <section class="grid-laporan" id="daftar-laporan">
      <p class="kosong">Memuat laporan...</p>
    </section>
  </main>

  <script type="module" src="js/ui/dashboard-admin.js"></script>
</body>
</html>
