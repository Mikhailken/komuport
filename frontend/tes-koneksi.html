<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tes Koneksi Backend - Komuport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- HALAMAN TES (bukan bagian tampilan utama)
       Dipakai untuk membuktikan frontend sudah tersambung ke backend Firebase. -->
  <main class="container">
    <h1>Tes Koneksi Backend</h1>
    <div id="status-firebase" class="status">Mengecek koneksi ke Firebase...</div>
  </main>

  <script type="module">
    import { db } from "./js/services/firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const kotak = document.getElementById("status-firebase");
    // Membaca satu dokumen tanpa login. Security Rules akan MENOLAK,
    // dan penolakan itu membuktikan koneksi + aturan keamanan sudah aktif.
    try {
      await getDoc(doc(db, "tes", "ping"));
      kotak.textContent = "Terhubung, TAPI database masih terbuka untuk umum. Pasang firestore.rules!";
      kotak.classList.add("peringatan");
    } catch (err) {
      if (err.code === "permission-denied") {
        kotak.textContent = "Terhubung ke Firebase ✓ — aturan keamanan aktif.";
        kotak.classList.add("berhasil");
      } else {
        kotak.textContent = "Gagal terhubung: " + err.message;
        kotak.classList.add("gagal");
        console.error(err);
      }
    }
  </script>
</body>
</html>
