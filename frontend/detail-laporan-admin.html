<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Laporan (Admin) - KomuReport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER NAVIGASI ADMIN ===== -->
  <header class="header">
    <div class="header-isi">
      <a href="dashboardadmin.html" class="brand-nama">Komu<span>Report</span></a>
      <nav class="nav">
        <a href="dashboardadmin.html" class="aktif">Dashboard</a>
        <a href="verifikasi-akun.html">Verifikasi Akun</a>
        <a href="login.html" id="tombol-logout">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <a href="dashboardadmin.html" class="link-kembali">← Kembali ke Dashboard</a>

    <!-- Isi diisi otomatis oleh js/ui/detail-admin.js berdasarkan ?id= -->
    <div class="detail">

      <!-- ===== KOLOM KIRI: judul + foto + hapus ===== -->
      <section class="detail-utama">
        <h1 id="judul-laporan">Memuat...</h1>
        <p class="detail-meta" id="meta-laporan"></p>
        <div class="detail-foto" id="foto-laporan"></div>
        <button type="button" class="tombol-hapus" id="hapus-laporan">Hapus Laporan</button>
      </section>

      <!-- ===== KOLOM KANAN: informasi + kelola ===== -->
      <aside class="detail-info">

        <div class="info-blok">
          <p class="info-label">Status</p>
          <span class="badge" id="status-laporan"></span>
        </div>

        <!-- Khusus admin: ubah status -->
        <div class="info-blok">
          <p class="info-label">Perbarui Status</p>
          <div class="pilihan-status">
            <button type="button" class="badge badge-belum" data-status="Belum Selesai">Belum Selesai</button>
            <button type="button" class="badge badge-proses" data-status="Diproses">Diproses</button>
            <button type="button" class="badge badge-selesai" data-status="Selesai">Selesai</button>
          </div>
          <p class="petunjuk">Klik status untuk mengubah. Status "Selesai" wajib disertai bukti.</p>

          <!-- Form bukti penyelesaian: muncul saat klik "Selesai" -->
          <form id="form-bukti" class="form-bukti" hidden>
            <label for="catatan-bukti">Catatan penyelesaian</label>
            <textarea id="catatan-bukti" rows="3" required
              placeholder="Contoh: Mobil sudah dipindahkan oleh pemiliknya pukul 14.00"></textarea>

            <label for="foto-bukti" class="kotak-upload">
              <img id="pratinjau-bukti" class="pratinjau" alt="Pratinjau foto bukti" hidden>
              <span id="teks-upload-bukti">Klik untuk upload foto bukti</span>
              <small>Dari kamera atau galeri</small>
            </label>
            <input type="file" id="foto-bukti" accept="image/*" class="input-tersembunyi">

            <div class="form-tombol">
              <button type="submit" class="tombol">Simpan &amp; Tandai Selesai</button>
              <button type="button" class="tombol-teks" id="batal-bukti">Batal</button>
            </div>
            <p id="pesan-bukti" class="pesan"></p>
          </form>
        </div>

        <!-- Bukti penyelesaian: tampil kalau status Selesai -->
        <div class="info-blok" id="blok-bukti" hidden>
          <p class="info-label">Bukti Penyelesaian</p>
          <div id="wadah-bukti"></div>
        </div>

        <div class="info-blok">
          <p class="info-label">Kategori</p>
          <p id="kategori-laporan"></p>
        </div>

        <div class="info-blok">
          <p class="info-label">Blok / Area</p>
          <p id="area-laporan"></p>
        </div>

        <div class="info-blok">
          <p class="info-label">Deskripsi</p>
          <p id="deskripsi-laporan"></p>
        </div>

        <div class="info-blok">
          <p class="info-label">Komentar</p>
          <div id="daftar-komentar"></div>

          <form id="form-komentar" class="form-komentar">
            <input type="text" id="isi-komentar" name="isi" placeholder="Tulis komentar..." required>
            <button type="submit" class="tombol">Kirim Komentar</button>
          </form>
        </div>

      </aside>
    </div>
  </main>

  <script type="module" src="js/ui/detail-admin.js"></script>
</body>
</html>
