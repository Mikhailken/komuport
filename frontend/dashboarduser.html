<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - KomuReport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER NAVIGASI (dipakai di semua halaman warga) ===== -->
  <header class="header">
    <div class="header-isi">
      <a href="dashboarduser.html" class="brand-nama">Komu<span>Report</span></a>
      <nav class="nav">
        <a href="dashboarduser.html" class="aktif">Dashboard</a>
        <a href="buat-laporan.html">Buat Laporan</a>
        <a href="profil.html">Profil</a>
        <a href="login.html" id="tombol-logout">Logout</a>  <!-- UBAH -->
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- Judul halaman + filter + tombol -->
    <div class="judul-halaman">
      <div>
        <h1>Dashboard</h1>
        <p class="subjudul">Daftar laporan dari warga</p>
      </div>
      <div class="aksi-halaman">
        <!-- UBAH: tiap tombol diberi data-filter, ditambah "Diproses" -->
        <div class="filter">
          <button type="button" class="filter-item aktif" data-filter="Semua">Semua</button>
          <button type="button" class="filter-item" data-filter="Belum Selesai">Belum Selesai</button>
          <button type="button" class="filter-item" data-filter="Diproses">Diproses</button>
          <button type="button" class="filter-item" data-filter="Selesai">Selesai</button>
        </div>
        <a href="buat-laporan.html" class="tombol">+ Buat Laporan</a>
      </div>
    </div>

    <!-- UBAH: diberi id; kartu diisi otomatis oleh js/ui/dashboard-user.js
         dari koleksi "laporan" di Firestore secara real-time -->
    <section class="grid-laporan" id="daftar-laporan">
      <p class="kosong">Memuat laporan...</p>
    </section>
  </main>

  <script type="module" src="js/ui/dashboard-user.js"></script>  <!-- BARU -->
</body>
</html>
