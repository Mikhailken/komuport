<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - KomuReport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER NAVIGASI ===== -->
  <header class="header">
    <div class="header-isi">
      <a href="dashboarduser.html" class="brand-nama">Komu<span>Report</span></a>
      <nav class="nav">
        <a href="dashboarduser.html">Dashboard</a>
        <a href="buat-laporan.html">Buat Laporan</a>
        <a href="profil.html" class="aktif">Profil</a>
        <a href="login.html" id="tombol-logout">Logout</a>  <!-- UBAH -->
      </nav>
    </div>
  </header>

  <main class="container">

    <div class="judul-halaman">
      <div>
        <h1>Profil</h1>
        <p class="subjudul">Data akun dan laporan yang pernah kamu buat</p>
      </div>
    </div>

    <!-- ===== DATA AKUN: diisi dari koleksi "users" oleh js/ui/profil.js ===== -->
    <section class="profil-kartu">
      <div class="profil-baris">
        <p class="info-label">Nama Lengkap</p>
        <p id="profil-nama">-</p>                                  <!-- UBAH -->
      </div>
      <div class="profil-baris">
        <p class="info-label">Email</p>
        <p id="profil-email">-</p>                                 <!-- UBAH -->
      </div>
      <div class="profil-baris">
        <p class="info-label">Blok / No. Rumah</p>
        <p id="profil-rumah">-</p>                                 <!-- UBAH -->
      </div>
      <div class="profil-baris">
        <p class="info-label">Status Akun</p>
        <span class="badge badge-aktif">Aktif</span>
      </div>
      <div class="profil-baris">
        <p class="info-label">Terdaftar Sejak</p>
        <p id="profil-terdaftar">-</p>                             <!-- UBAH -->
      </div>
    </section>

    <!-- ===== LAPORAN SAYA: real-time, hanya laporan milik akun ini ===== -->
    <h2 class="judul-bagian">Laporan Saya (<span id="jumlah-laporan-saya">0</span>)</h2>  <!-- UBAH -->
    <section class="grid-laporan" id="laporan-saya">                <!-- UBAH -->
      <p class="kosong">Memuat laporan...</p>
    </section>
  </main>

  <script type="module" src="js/ui/profil.js"></script>  <!-- BARU -->
</body>
</html>
